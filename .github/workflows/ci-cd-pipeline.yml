name: CI/CD Pipeline

on:
    push:
        branches:
            - master
jobs:
    test:
        runs-on: ubuntu-latest
        env:
            DB_URL: postgresql://olorin4:password@localhost:5432/iwd_test
            PGPASSWORD: password

        services:
            postgres:
                image: postgres:13
                env:
                    POSTGRES_USER: olorin4
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: iwd_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            # Step 1: Check out the code
            - name: Checkout code
              uses: actions/checkout@v4

            # Step 2: Set up Node.js
            - name: Read Node.js version from .nvmrc
              run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            # Step 3: Install dependencies
            - name: Install dependencies
              run: npm ci

            # Step 4: Wait for PostgreSQL to be ready
            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U olorin4; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

            # Step 5: Create and set up the test database
            - name: Create and set up test database
              run: |
                  npm run db:test:create
                  npm run db:test:setup

            # Step 6: Generate the client explicitly before importing it in tests.
            # Prisma 7 migrate deploy does not generate the client.
            - name: Run tests
              run: |
                  npx prisma generate
                  npm test

    build:
        if: github.actor == 'Olorin4'
        needs: test
        runs-on: ubuntu-latest

        steps:
            # Step 1: Check out the code
            - name: Checkout code
              uses: actions/checkout@v4

            # Step 2: Set up Node.js
            - name: Read Node.js version from .nvmrc
              run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            # Step 3: Install dependencies
            - name: Install dependencies
              run: npm ci

            # Step 4: Generate .env file from GitHub Secrets
            - name: Generate .env file
              run: |
                  echo "NODE_ENV=production" > .env
                  echo "PORT=${{ secrets.PORT }}" >> .env
                  echo "DB_URL=${{ secrets.DB_URL }}" >> .env
                  echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
                  echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
                  echo "DB_USER=${{ secrets.DB_USER }}" >> .env
                  echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
                  echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
                  echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> .env
                  echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
                  echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> .env
                  echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
                  echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env
                  echo "POSTHOG_PROJECT_TOKEN=${{ secrets.POSTHOG_PROJECT_TOKEN }}" >> .env
                  echo "OUTREACH_CONVERSION_WEBHOOK_URL=${{ secrets.OUTREACH_CONVERSION_WEBHOOK_URL }}" >> .env
                  echo "OUTREACH_WEBHOOK_TOKEN=${{ secrets.OUTREACH_WEBHOOK_TOKEN }}" >> .env
                  echo "ADMIN_API_TOKEN=${{ secrets.ADMIN_API_TOKEN }}" >> .env
                  echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .env

                  # TEMPORARY: delete when the KelevoTMS dispatching-agency billing feature is live. See DISPOSE.md.
                  echo "INTERIM_BILLING_ENABLED=${{ secrets.INTERIM_BILLING_ENABLED }}" >> .env
                  echo "INTERIM_BILLING_MODE=${{ secrets.INTERIM_BILLING_MODE }}" >> .env
                  echo "INTERIM_BILLING_LIVE_CONFIRM=${{ secrets.INTERIM_BILLING_LIVE_CONFIRM }}" >> .env
                  echo "INTERIM_BILLING_TIMEZONE=${{ secrets.INTERIM_BILLING_TIMEZONE }}" >> .env
                  echo "INTERIM_BILLING_RUN_HOUR=${{ secrets.INTERIM_BILLING_RUN_HOUR }}" >> .env
                  echo "INTERIM_BILLING_START_DATE=${{ secrets.INTERIM_BILLING_START_DATE }}" >> .env
                  echo "INTERIM_BILLING_AUTO_RUN=${{ secrets.INTERIM_BILLING_AUTO_RUN }}" >> .env
                  echo "INTERIM_BILLING_KELEVO_SSH_HOST=${{ secrets.INTERIM_BILLING_KELEVO_SSH_HOST }}" >> .env
                  echo "INTERIM_BILLING_KELEVO_SSH_USER=${{ secrets.INTERIM_BILLING_KELEVO_SSH_USER }}" >> .env
                  echo "INTERIM_BILLING_KELEVO_SSH_KEY_FILE=${{ secrets.INTERIM_BILLING_KELEVO_SSH_KEY_FILE }}" >> .env
                  echo "INTERIM_BILLING_KELEVO_SSH_KNOWN_HOSTS_FILE=${{ secrets.INTERIM_BILLING_KELEVO_SSH_KNOWN_HOSTS_FILE }}" >> .env
                  echo "INTERIM_BILLING_LOADS_FILE=${{ secrets.INTERIM_BILLING_LOADS_FILE }}" >> .env
                  echo "INTERIM_BILLING_STRIPE_WEBHOOK_SECRET=${{ secrets.INTERIM_BILLING_STRIPE_WEBHOOK_SECRET }}" >> .env
                  echo "INTERIM_BILLING_PRODUCT_ID=${{ secrets.INTERIM_BILLING_PRODUCT_ID }}" >> .env
                  echo "INTERIM_BILLING_ADMIN_EMAIL=${{ secrets.INTERIM_BILLING_ADMIN_EMAIL }}" >> .env
                  echo "INTERIM_BILLING_ADMIN_TOKEN=${{ secrets.INTERIM_BILLING_ADMIN_TOKEN }}" >> .env
                  echo "STRIPE_SANDBOX_SECRET_KEY=${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}" >> .env
                  echo "STRIPE_LIVE_SECRET_KEY=${{ secrets.STRIPE_LIVE_SECRET_KEY }}" >> .env
                  # Permanent client onboarding (live since 2026-11-18). Every value here
                  # must also exist on the server; a missing secret silently disables onboarding.
                  echo "IWD_ONBOARDING_TOKEN=${{ secrets.IWD_ONBOARDING_TOKEN }}" >> .env
                  echo "ONBOARDING_CONTINUE_TOKEN_SECRET=${{ secrets.ONBOARDING_CONTINUE_TOKEN_SECRET }}" >> .env
                  echo "ONBOARDING_COUNTERSIGNER_EMAIL=${{ secrets.ONBOARDING_COUNTERSIGNER_EMAIL }}" >> .env
                  echo "ONBOARDING_COUNTERSIGNER_NAME=${{ secrets.ONBOARDING_COUNTERSIGNER_NAME }}" >> .env
                  echo "ONBOARDING_COUNTERSIGNER_TITLE=${{ secrets.ONBOARDING_COUNTERSIGNER_TITLE }}" >> .env
                  echo "ONBOARDING_DOCUMENT_DIR=${{ secrets.ONBOARDING_DOCUMENT_DIR }}" >> .env
                  echo "ONBOARDING_DOCUMENT_KEY=${{ secrets.ONBOARDING_DOCUMENT_KEY }}" >> .env
                  echo "ONBOARDING_ENABLED=${{ secrets.ONBOARDING_ENABLED }}" >> .env
                  echo "ONBOARDING_IRON_WING_EMAIL_DELAY_MINUTES=${{ secrets.ONBOARDING_IRON_WING_EMAIL_DELAY_MINUTES }}" >> .env
                  echo "ONBOARDING_PROVISIONING_ADAPTER=${{ secrets.ONBOARDING_PROVISIONING_ADAPTER }}" >> .env
                  echo "ONBOARDING_PUBLIC_BASE_URL=${{ secrets.ONBOARDING_PUBLIC_BASE_URL }}" >> .env
                  echo "ONBOARDING_RECONCILE_ENABLED=${{ secrets.ONBOARDING_RECONCILE_ENABLED }}" >> .env
                  echo "ONBOARDING_REQUESTER_EMAIL=${{ secrets.ONBOARDING_REQUESTER_EMAIL }}" >> .env
                  echo "ONBOARDING_DEFAULT_DISPATCHER_NAME=${{ secrets.ONBOARDING_DEFAULT_DISPATCHER_NAME }}" >> .env
                  echo "ONBOARDING_DEFAULT_DISPATCHER_EMAIL=${{ secrets.ONBOARDING_DEFAULT_DISPATCHER_EMAIL }}" >> .env
                  echo "ONBOARDING_REQUEST_SIGNING_SECRET=${{ secrets.ONBOARDING_REQUEST_SIGNING_SECRET }}" >> .env
                  echo "ONBOARDING_SIGNATURE_PROVIDER=${{ secrets.ONBOARDING_SIGNATURE_PROVIDER }}" >> .env
                  echo "ONBOARDING_SIGNWELL_TEST_MODE=${{ secrets.ONBOARDING_SIGNWELL_TEST_MODE }}" >> .env
                  echo "ONBOARDING_STATUS_SIGNING_SECRET=${{ secrets.ONBOARDING_STATUS_SIGNING_SECRET }}" >> .env
                  echo "ONBOARDING_STATUS_TOKEN=${{ secrets.ONBOARDING_STATUS_TOKEN }}" >> .env
                  echo "ONBOARDING_STRIPE_CANCEL_URL=${{ secrets.ONBOARDING_STRIPE_CANCEL_URL }}" >> .env
                  echo "ONBOARDING_STRIPE_LIVE_CONFIRM=${{ secrets.ONBOARDING_STRIPE_LIVE_CONFIRM }}" >> .env
                  echo "ONBOARDING_STRIPE_SECRET_KEY=${{ secrets.ONBOARDING_STRIPE_SECRET_KEY }}" >> .env
                  echo "ONBOARDING_STRIPE_SUCCESS_URL=${{ secrets.ONBOARDING_STRIPE_SUCCESS_URL }}" >> .env
                  echo "ONBOARDING_STRIPE_WEBHOOK_SECRET=${{ secrets.ONBOARDING_STRIPE_WEBHOOK_SECRET }}" >> .env
                  echo "OUTREACH_STATUS_URL=${{ secrets.OUTREACH_STATUS_URL }}" >> .env
                  echo "ONBOARDING_PORTAL_ENABLED=${{ secrets.ONBOARDING_PORTAL_ENABLED }}" >> .env
                  echo "ONBOARDING_PORTAL_BASE_URL=${{ secrets.ONBOARDING_PORTAL_BASE_URL }}" >> .env
                  echo "ONBOARDING_PORTAL_TOKEN_SECRET=${{ secrets.ONBOARDING_PORTAL_TOKEN_SECRET }}" >> .env
                  echo "ONBOARDING_R2_ACCOUNT_ID=${{ secrets.ONBOARDING_R2_ACCOUNT_ID }}" >> .env
                  echo "ONBOARDING_R2_BUCKET=${{ secrets.ONBOARDING_R2_BUCKET }}" >> .env
                  echo "ONBOARDING_R2_ACCESS_KEY_ID=${{ secrets.ONBOARDING_R2_ACCESS_KEY_ID }}" >> .env
                  echo "ONBOARDING_R2_SECRET_ACCESS_KEY=${{ secrets.ONBOARDING_R2_SECRET_ACCESS_KEY }}" >> .env
                  echo "ONBOARDING_FILE_ENCRYPTION_KEY=${{ secrets.ONBOARDING_FILE_ENCRYPTION_KEY }}" >> .env
                  echo "ONBOARDING_DOC_READER_ENABLED=${{ secrets.ONBOARDING_DOC_READER_ENABLED }}" >> .env
                  echo "ONBOARDING_DOC_READER_MODEL=${{ secrets.ONBOARDING_DOC_READER_MODEL }}" >> .env
                  echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
                  echo "SIGNWELL_API_KEY=${{ secrets.SIGNWELL_API_KEY }}" >> .env
                  echo "SIGNWELL_WEBHOOK_ID=${{ secrets.SIGNWELL_WEBHOOK_ID }}" >> .env

            # Step 5: Deploy to Server (Docker)
            #
            # The backend runs as a Docker container (service `api`, name
            # `iwd-backend`) on the shared external `edge` network, behind the
            # containerized nginx edge. We rsync the build context + the .env
            # generated above, then rebuild and recreate the container. DB
            # migrations run inside the container at startup (see Dockerfile CMD),
            # so no host-side node/npm/prisma/pm2 is involved.
            - name: Deploy to Server
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_AWS_SERVER_KEY }}
                  SERVER_IP: ${{ secrets.SERVER_IP }}
              run: |
                  # The key lives outside the checkout so it is never copied
                  # to the server or into the Docker image with the code.
                  KEY="$RUNNER_TEMP/deploy_key"
                  trap 'rm -f "$KEY"' EXIT
                  install -m 600 /dev/null "$KEY"
                  echo "$SSH_PRIVATE_KEY" > "$KEY"

                  echo "🚀 Transferring build context to the server using rsync..."
                  rsync -avz --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='logs' --exclude='*.pem' \
                    -e "ssh -i $KEY -o StrictHostKeyChecking=no" ./ \
                    nick-kalas@$SERVER_IP:/home/nick-kalas/apps/iwd-backend

                  echo "🚀 Rebuilding and restarting the Docker container..."
                  ssh -i "$KEY" -o StrictHostKeyChecking=no nick-kalas@$SERVER_IP << 'EOF'
                    set -e
                    cd /home/nick-kalas/apps/iwd-backend

                    # Rebuild the image from the rsync'd source and recreate the
                    # container, picking up code + .env changes. Migrations run on
                    # container start via the Dockerfile CMD.
                    docker compose up -d --build

                    # Drop dangling images left by the rebuild.
                    docker image prune -f

                    echo "✅ Deployment completed successfully."
                  EOF
