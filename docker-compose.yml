name: iwd-backend

# api.iron-wing-dispatching.com — joins the shared `edge` network so the
# containerized nginx edge reaches it by service name (http://iwd-backend:3000).
# No host ports: only the edge talks to it. Create .env on the box first.
services:
    api:
        build: .
        image: iwd-backend:latest
        container_name: iwd-backend
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3000
        env_file:
            - .env
        # The DB lives on the home server, reachable only over Tailscale. The
        # container can't resolve Tailscale MagicDNS (.ts.net) names, so map the
        # DB host to the home server's stable tailnet IP. Keeps DB_URL/DB_HOST in
        # .env readable (and CI-regenerated from secrets) while resolving here.
        extra_hosts:
            - "nk-homeserver.tail4feae2.ts.net:100.111.141.61"
        networks:
            - edge

networks:
    edge:
        external: true
